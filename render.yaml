databases:
  - name: osama-db
    databaseName: osama
    user: osama
    plan: free
    region: frankfurt

services:
  - type: web
    name: osama-portfolio
    runtime: node
    plan: free
    region: frankfurt
    branch: arena/01a07db7-osamaabdelnabyalaam
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: osama-db
          property: connectionString
