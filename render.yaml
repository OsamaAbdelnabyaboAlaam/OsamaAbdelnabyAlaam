services:
  - type: web
    name: osama-portfolio
    runtime: node
    plan: free
    region: frankfurt
    branch: arena/01a07db7-osamaabdelnabyalaam
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # ملاحظة: الخطة المجانية لا تدعم الأقراص الدائمة (disks).
      # لذلك تُخزَّن قاعدة البيانات في /tmp وتُعاد تهيئتها بالبيانات الأولية
      # عند كل إعادة نشر أو استيقاظ من وضع الخمول.
      # للحصول على تخزين دائم: ارفع الخطة إلى starter وأعد إضافة قسم disk
      # مع DATA_DIR=/var/data (التفاصيل في README).
      - key: DATA_DIR
        value: /tmp/data
