databases:
  - name: osama-db
    databaseName: osama
    user: osama

services:
  - type: web
    name: osama-portfolio
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: osama-db
          property: connectionString
